name: Build macOS App

on:
  workflow_dispatch: # 깃허브 웹사이트에서 수동으로 빌드를 시작할 수 있게 합니다.

jobs:
  build:
    runs-on: macos-latest # 클라우드의 가상 맥북 환경을 빌립니다.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --windowed --name="VideoGifMaker" app.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoGifMaker-macOS
          path: dist/VideoGifMaker.app
